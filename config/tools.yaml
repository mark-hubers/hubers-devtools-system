# ============================================================================
# VERSION MANAGER (asdf) - Install this first for version-managed tools
# ============================================================================
version_manager:
  - name: asdf
    brew: asdf
    description: "Universal version manager - manages terraform, kubectl, node, python, etc."
    check: "asdf --version"
    post_install:
      - "echo '' >> ~/.zshrc"
      - "echo '# asdf version manager' >> ~/.zshrc"
      - "echo '. $(brew --prefix asdf)/libexec/asdf.sh' >> ~/.zshrc"
    required: true
    docs: "https://asdf-vm.com"

# ============================================================================
# ASDF-MANAGED TOOLS - Use asdf for these (version switching!)
# ============================================================================
# These tools benefit from version management because:
# - Different projects may need different versions
# - You can use .tool-versions files for auto-switching
# - Easy to test with newer/older versions
#
# After installing via 'devsetup add <tool>', install a version with:
#   asdf install <tool> latest
#   asdf set --home <tool> latest
# Or for a specific version:
#   asdf install terraform 1.5.7
#   asdf set --home terraform 1.5.7
# ============================================================================
asdf_tools:
  - name: terraform
    asdf_plugin: terraform
    description: "Infrastructure as Code - USE ASDF! Projects need different versions"
    check: "terraform version"
    required: true
    docs: "https://www.terraform.io/docs"
    default_version: "latest"
    
  - name: kubectl
    asdf_plugin: kubectl
    description: "Kubernetes CLI - asdf lets you match cluster versions"
    check: "kubectl version --client"
    required: true
    docs: "https://kubernetes.io/docs/reference/kubectl/"
    default_version: "latest"
    
  - name: helm
    asdf_plugin: helm
    description: "Kubernetes package manager"
    check: "helm version"
    required: true
    default_version: "latest"
    
  - name: nodejs
    asdf_plugin: nodejs
    description: "Node.js runtime - different projects need different versions"
    check: "node --version"
    required: true
    default_version: "lts"
    
  - name: python
    asdf_plugin: python
    description: "Python runtime - manage multiple versions easily"
    check: "python3 --version"
    required: true
    default_version: "latest"
    
  - name: golang
    asdf_plugin: golang
    description: "Go programming language"
    check: "go version"
    required: false
    default_version: "latest"
    
  - name: ruby
    asdf_plugin: ruby
    description: "Ruby programming language"
    check: "ruby --version"
    required: false
    default_version: "latest"

  - name: awscli
    asdf_plugin: awscli
    description: "AWS CLI v2 - can also use asdf for version management"
    check: "aws --version"
    required: true
    default_version: "latest"
    docs: "https://aws.amazon.com/cli/"
    
  - name: azure-cli
    asdf_plugin: azure-cli
    description: "Microsoft Azure CLI"
    check: "az --version"
    required: false
    default_version: "latest"
    
  - name: gcloud
    asdf_plugin: gcloud
    description: "Google Cloud SDK"
    check: "gcloud --version"
    required: false
    default_version: "latest"
    
  - name: terragrunt
    asdf_plugin: terragrunt
    description: "Terraform wrapper for DRY infrastructure code"
    check: "terragrunt --version"
    required: false
    default_version: "latest"
    
  - name: packer
    asdf_plugin: packer
    description: "Build automated machine images"
    check: "packer --version"
    required: false
    default_version: "latest"
    
  - name: vault
    asdf_plugin: vault
    description: "HashiCorp Vault - secrets management"
    check: "vault --version"
    required: false
    default_version: "latest"
    
  - name: java
    asdf_plugin: java
    description: "Java JDK - manage multiple Java versions"
    check: "java --version"
    required: false
    default_version: "openjdk-21"

  - name: rust
    asdf_plugin: rust
    description: "Rust programming language (can also use rustup)"
    check: "rustc --version"
    required: false
    default_version: "latest"

