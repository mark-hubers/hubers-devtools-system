# ============================================================================
markdown_tools:
  - name: pandoc
    brew: pandoc
    description: "Universal document converter - MD to PDF, DOCX, HTML, etc."
    check: "pandoc --version"
    required: true
    docs: "https://pandoc.org"
    
  - name: glow
    brew: glow
    description: "Render markdown beautifully in terminal"
    check: "glow --version"
    required: true
    
  - name: mdcat
    brew: mdcat
    description: "Cat for markdown - renders in terminal with images"
    check: "mdcat --version"
    required: false
    
  - name: grip
    brew: grip
    description: "GitHub-flavored markdown preview in browser"
    check: "grip --version"
    required: false
    docs: "https://github.com/joeyespo/grip"

  - name: marp-cli
    description: "Markdown to presentation slides (PDF, PPTX, HTML)"
    check: "marp --version"
    install_manual: |
      npm install -g @marp-team/marp-cli
    required: false
    docs: "https://marp.app"
    
  - name: md-to-pdf
    description: "Simple markdown to PDF conversion"
    check: "md-to-pdf --version"
    install_manual: |
      npm install -g md-to-pdf
    required: false
    
  - name: basictex
    brew: basictex
    cask: true
    description: "LaTeX for pandoc PDF generation (smaller than full MacTeX)"
    check: "pdflatex --version"
    post_install:
      - "sudo tlmgr update --self"
      - "sudo tlmgr install collection-fontsrecommended"
    required: false
    
  - name: wkhtmltopdf
    brew: wkhtmltopdf
    description: "HTML to PDF converter (alternative PDF engine for pandoc)"
    check: "wkhtmltopdf --version"
    required: false
    
  - name: lynx
    brew: lynx
    description: "Text-based web browser - great for converting HTML to text"
    check: "lynx --version"
    required: false
