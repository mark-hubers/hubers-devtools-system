# ============================================================================
# Mac Dev Setup - Tool Manifest
# ============================================================================
# This file defines ALL tools managed by the setup system.
# 
# HOW TO ADD A NEW TOOL:
#   1. Find the right category (or create one)
#   2. Add a new entry with these fields:
#      - name: Tool name (required)
#      - brew: Homebrew formula/cask name (if installable via brew)
#      - cask: true if it's a Homebrew Cask (GUI app)
#      - tap: Custom Homebrew tap if needed
#      - description: What the tool does
#      - required: true if essential for your workflow
#      - check: Command to verify installation
#      - post_install: Commands to run after installation
#      - config: Config file locations to backup/restore
#      - docs: URL to documentation
#
# MAINTENANCE TIPS:
#   - Run 'devsetup check' to see what's installed/missing
#   - Run 'devsetup outdated' to see what needs updates
#   - Run 'devsetup export' to backup your tool list
# ============================================================================

version: "2.0"
last_updated: "2025-01-07"

# ============================================================================
# CORE - Absolutely essential, install first
# ============================================================================
core:
  - name: homebrew
    description: "Package manager for macOS - INSTALL THIS FIRST MANUALLY"
    check: "brew --version"
    docs: "https://brew.sh"
    install_manual: |
      /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
    required: true
    
  - name: git
    brew: git
    description: "Version control"
    check: "git --version"
    required: true
    
  - name: zsh
    brew: zsh
    description: "Z shell - better than bash"
    check: "zsh --version"
    required: true

# ============================================================================
# SHELL - Terminal enhancement
# ============================================================================
shell:
  - name: oh-my-zsh
    description: "ZSH framework with plugins"
    check: "test -d ~/.oh-my-zsh"
    install_manual: |
      sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"
    post_install:
      - "git clone https://github.com/zsh-users/zsh-autosuggestions ${ZSH_CUSTOM:-~/.oh-my-zsh/custom}/plugins/zsh-autosuggestions"
      - "git clone https://github.com/zsh-users/zsh-syntax-highlighting.git ${ZSH_CUSTOM:-~/.oh-my-zsh/custom}/plugins/zsh-syntax-highlighting"
      - "git clone https://github.com/zdharma-continuum/fast-syntax-highlighting.git ${ZSH_CUSTOM:-~/.oh-my-zsh/custom}/plugins/fast-syntax-highlighting"
      - "git clone https://github.com/Aloxaf/fzf-tab ${ZSH_CUSTOM:-~/.oh-my-zsh/custom}/plugins/fzf-tab"
    required: true
    
  - name: powerlevel10k
    brew: powerlevel10k
    description: "Beautiful, fast ZSH prompt with transient prompt"
    check: "test -f /opt/homebrew/share/powerlevel10k/powerlevel10k.zsh-theme || test -f ~/powerlevel10k/powerlevel10k.zsh-theme"
    post_install:
      - "echo 'Run: p10k configure'"
    required: true
    docs: "https://github.com/romkatv/powerlevel10k"
    
  - name: fzf
    brew: fzf
    description: "Fuzzy finder - essential for productivity"
    check: "fzf --version"
    post_install:
      - "$(brew --prefix)/opt/fzf/install --all"
    required: true

