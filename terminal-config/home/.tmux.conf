## ~/.tmux.conf - minimal, accessibility-aware defaults.
##
## Kept deliberately small: iTerm2's native integration (tmux -CC) provides the
## tabs, scrollback and mouse, so tmux does not need to reinvent them. Heavy
## tmux theming would fight iTerm2 rather than help.

## Long scrollback - sessions here run for weeks
set -g history-limit 100000

## Mouse on (harmless under -CC, useful when attached over plain ssh/mosh)
set -g mouse on

## Windows/panes number from 1 - matches the keyboard, easier to hit
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

## Do not let one small client shrink a big one
setw -g aggressive-resize on

## Responsive escape (vim/Claude Code feel sluggish at the default 500ms)
set -sg escape-time 10

## Keep the client alive across brief network drops
set -g focus-events on

## ACCESSIBILITY - Mark has a 5-10 degree field of vision. The status bar is
## HIGH CONTRAST and carries only what matters: session name and window list.
## No decorative segments, no low-contrast greys, nothing that has to be
## scanned across a wide screen.
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style 'bg=colour234 fg=colour255 bold'
set -g status-left  '#[bg=colour33,fg=colour255,bold] #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=colour255,bold] %H:%M '
set -g status-right-length 20
setw -g window-status-current-style 'bg=colour178 fg=colour16 bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '

## Message/prompt colours - high contrast, not the default dim green
set -g message-style 'bg=colour33 fg=colour255 bold'

## Reload config without restarting: prefix + r
bind r source-file ~/.tmux.conf \; display-message "-PASS- tmux.conf reloaded"

## Splits that keep the current directory (default loses it)
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"
